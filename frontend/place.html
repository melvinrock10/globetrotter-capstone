-<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Place details — Explore Fako</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css">
<style>
  .place-detail { max-width: 800px; margin: 2rem auto; padding: 0 2rem; }
  .place-hero { height: 280px; border-radius: 14px; background: linear-gradient(135deg, var(--green-deep), var(--green-dark)); background-size: cover; background-position: center; margin-bottom: 1.5rem; display:flex; align-items:center; justify-content:center; color: rgba(255,255,255,0.5); font-family: var(--font-mono); }
  .place-title-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .place-detail h1 { font-family: var(--font-display); font-size: 2rem; margin: 0 0 0.3rem; }
  .place-detail .category-tag { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; color: var(--gold); }
  .place-detail .meta-row { color: #6B756E; margin: 0.6rem 0 1.2rem; font-size: 0.95rem; }
  .place-detail .rating-big { font-family: var(--font-mono); font-size: 1.1rem; color: var(--green-deep); font-weight: 600; }
  #detail-map { height: 240px; border-radius: 12px; margin: 1.2rem 0; }
  .reviews-section { margin-top: 2.5rem; }
  .review-form { background: var(--white); border-radius: 12px; padding: 1.2rem; box-shadow: 0 4px 14px rgba(20,35,28,0.08); margin-bottom: 1.5rem; }
  .review-form select, .review-form textarea { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #DDE0D8; border-radius: 8px; font-family: var(--font-body); margin-bottom: 0.7rem; }
  .review-card { background: var(--white); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem; box-shadow: 0 2px 8px rgba(20,35,28,0.06); }
  .review-card .review-head { display: flex; justify-content: space-between; font-size: 0.85rem; color: #6B756E; margin-bottom: 0.4rem; }
  .review-card .stars { color: var(--gold); font-family: var(--font-mono); }
  .details-box { margin: 1.5rem 0; background: var(--white); border-radius: 12px; padding: 1.2rem 1.4rem; box-shadow: 0 2px 8px rgba(20,35,28,0.07); }
  .details-table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; }
  .details-table td { padding: 0.5rem 0; border-bottom: 1px solid #EDEFEA; font-size: 0.92rem; }
  .details-table td:first-child { color: #4A544D; }
  .details-table td:last-child { text-align: right; font-weight: 600; color: var(--green-deep); font-family: var(--font-mono); }
  .distance-box { margin: 1.5rem 0; background: var(--mist); border-radius: 12px; padding: 1.2rem 1.4rem; }
  .fare-card { display: flex; gap: 1rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .fare-pill { background: var(--white); border-radius: 10px; padding: 0.8rem 1.2rem; font-family: var(--font-mono); font-size: 0.9rem; }
  .fare-pill strong { display: block; font-size: 1.1rem; color: var(--green-deep); font-family: var(--font-body); }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">Explore<span>Fako</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="browse.html">Browse</a>
    <a href="login.html" id="nav-login">Log in</a>
    <a href="admin.html" id="nav-admin" style="display:none;">Admin</a>
    <a href="#" id="nav-logout" class="btn-primary" style="display:none;">Log out</a>
  </nav>
</div>

<div class="breadcrumb">
  <a href="index.html">Home</a> <span class="sep">/</span> <a href="browse.html">Browse</a> <span class="sep">/</span> <span id="crumb-current">Place</span>
</div>
<div class="place-detail" id="place-detail">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <p style="font-family: var(--font-mono); color:#6B756E;">Loading…</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="api.js"></script>
<script>
  function updateNav() {
    document.getElementById("nav-login").style.display = isLoggedIn() ? "none" : "inline";
    document.getElementById("nav-logout").style.display = isLoggedIn() ? "inline" : "none";
    document.getElementById("nav-admin").style.display = isAdmin() ? "inline" : "none";
  }
  document.getElementById("nav-logout").addEventListener("click", (e) => {
    e.preventDefault();
    apiLogout();
    updateNav();
    window.location.href = "index.html";
  });
  updateNav();

  const params = new URLSearchParams(window.location.search);
  const placeId = params.get("id");

  let dmap = null;
  let userMarker = null;
  let routeLine = null;

  function toRad(deg) { return deg * (Math.PI / 180); }

  function haversineDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  async function findDistanceAndFare(placeLat, placeLng) {
    const resultEl = document.getElementById("distance-result");
    const btn = document.getElementById("find-distance-btn");

    if (!navigator.geolocation) {
      resultEl.innerHTML = `<p style="color:#B3261E;">Your browser doesn't support location services.</p>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Locating…";

    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const distanceKm = haversineDistanceKm(userLat, userLng, placeLat, placeLng);

        let ratesHtml = "";
        try {
          const settings = await apiGetSettings();
          const taxiFare = settings.taxi_rate_per_km ? Math.round(distanceKm * settings.taxi_rate_per_km) : null;
          const bikeFare = settings.bike_rate_per_km ? Math.round(distanceKm * settings.bike_rate_per_km) : null;
          ratesHtml = `
            <div class="fare-card">
              ${taxiFare != null ? `<div class="fare-pill"><strong>${taxiFare.toLocaleString()} FCFA</strong>Estimated taxi fare</div>` : ""}
              ${bikeFare != null ? `<div class="fare-pill"><strong>${bikeFare.toLocaleString()} FCFA</strong>Estimated bike/moto fare</div>` : ""}
            </div>
          `;
        } catch (err) {
          ratesHtml = `<p style="color:#6B756E; font-size:0.85rem;">Fare rates not set yet.</p>`;
        }

        resultEl.innerHTML = `
          <p style="font-family: var(--font-mono); color: var(--green-deep); font-weight:600;">
            ~${distanceKm.toFixed(1)} km from your current location
          </p>
          ${ratesHtml}
          <button class="btn" id="cancel-route-btn" style="background:#6B756E; margin-top:0.6rem;">Cancel route</button>
        `;
        btn.style.display = "none";

        if (dmap) {
          if (userMarker) dmap.removeLayer(userMarker);
          if (routeLine) dmap.removeLayer(routeLine);

          userMarker = L.circleMarker([userLat, userLng], {
            radius: 8, color: "#C98A2C", fillColor: "#C98A2C", fillOpacity: 0.9,
          }).addTo(dmap).bindPopup("Your location");

          try {
            const routeResp = await fetch(
              `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${placeLng},${placeLat}?overview=full&geometries=geojson`
            );
            const routeData = await routeResp.json();
            if (routeData.routes && routeData.routes[0]) {
              const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              routeLine = L.polyline(coords, { color: "#1F4D3E", weight: 4, opacity: 0.8 }).addTo(dmap);
              dmap.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
            } else {
              dmap.fitBounds(L.latLngBounds([[userLat, userLng], [placeLat, placeLng]]), { padding: [30, 30] });
            }
          } catch (err) {
            dmap.fitBounds(L.latLngBounds([[userLat, userLng], [placeLat, placeLng]]), { padding: [30, 30] });
          }
        }

        document.getElementById("cancel-route-btn").addEventListener("click", () => {
          if (userMarker && dmap) dmap.removeLayer(userMarker);
          if (routeLine && dmap) dmap.removeLayer(routeLine);
          userMarker = null;
          routeLine = null;
          if (dmap) dmap.setView([placeLat, placeLng], 15);
          resultEl.innerHTML = "";
          btn.style.display = "inline-block";
          btn.disabled = false;
          btn.textContent = "📍 Share my location to see distance & fare";
        });
      },
      (error) => {
        resultEl.innerHTML = `<p style="color:#B3261E;">Could not get your location. Please allow location access in your browser and try again.</p>`;
        btn.disabled = false;
        btn.textContent = "📍 Share my location to see distance & fare";
      }
    );
  }

  function renderDistanceBox(place) {
    const box = document.getElementById("distance-box");
    if (!isLoggedIn()) {
      box.innerHTML = `<p style="color:#6B756E;">📍 <a href="login.html" style="color:var(--green-deep);font-weight:600;">Log in</a> to see distance and estimated fare from your location.</p>`;
      return;
    }
    box.innerHTML = `
      <p style="font-size:0.88rem; color:#4A544D; margin-bottom:0.7rem;">We'll use your device's location just once, only to estimate distance and fare — it's never stored or shared.</p>
      <button class="btn" id="find-distance-btn">📍 Share my location to see distance &amp; fare</button>
      <div id="distance-result" style="margin-top:0.8rem;"></div>
    `;
    document.getElementById("find-distance-btn").addEventListener("click", () => findDistanceAndFare(place.latitude, place.longitude));
  }
  async function loadPlace() {
    const container = document.getElementById("place-detail");
    if (!placeId) {
      container.innerHTML = `<p>No place specified.</p>`;
      return;
    }
    try {
      const place = await apiGetPlace(placeId);
      document.getElementById("crumb-current").textContent = place.name;
      const reviews = await apiGetReviews(placeId);

      container.innerHTML = `
        <div class="place-hero" style="${place.image_url ? `background-image:url('${place.image_url}')` : ""}">
          ${place.image_url ? "" : "No image yet"}
        </div>
        <div class="place-title-row">
          <div>
            <div class="category-tag">${place.category || ""}</div>
            <h1>${place.name}</h1>
          </div>
          <div class="rating-big">★ ${place.average_rating ?? "—"} <span style="font-size:0.75rem;color:#6B756E;">(${place.review_count ?? 0})</span></div>
        </div>
        <div class="meta-row">
          ${place.town ? place.town + " — " : ""}${place.address || ""}
          ${place.phone ? "<br>" + place.phone : ""}
        </div>
        <p>${place.description || ""}</p>

        ${place.details && place.details.length ? `
          <div class="details-box">
            <h3 style="font-family: var(--font-display); font-size:1.1rem;">What this place offers</h3>
            <table class="details-table">
              ${place.details.map(d => `<tr><td>${d.label}</td><td>${d.value}</td></tr>`).join("")}
            </table>
          </div>
        ` : ""}

        <div id="distance-box" class="distance-box"></div>

        <div id="detail-map"></div>

        <div class="reviews-section">
          <h2 style="font-family: var(--font-display);">Reviews</h2>
          <div id="review-form-area"></div>
          <div id="reviews-list"></div>
        </div>
        <div id="prev-next-area"></div>
      `;

      if (place.latitude != null && place.longitude != null) {
        dmap = L.map('detail-map').setView([place.latitude, place.longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(dmap);
        L.marker([place.latitude, place.longitude]).addTo(dmap).bindPopup(place.name).openPopup();
      } else {
        document.getElementById("detail-map").innerHTML = `<p style="font-family: var(--font-mono); color:#6B756E; padding:1rem;">No coordinates set for this place yet.</p>`;
      }

      renderDistanceBox(place);
      renderReviewForm();
      renderPrevNext();
      renderReviews(reviews);
    } catch (err) {
      container.innerHTML = `<p style="color:#B3261E;">Could not load this place.</p>`;
    }
  }

    function renderPrevNext() {
    const area = document.getElementById("prev-next-area");
    const listRaw = sessionStorage.getItem("gt_place_list");
    if (!listRaw) { area.innerHTML = ""; return; }
    const list = JSON.parse(listRaw);
    const idx = list.indexOf(placeId);
    if (idx === -1) { area.innerHTML = ""; return; }

    const prevId = idx > 0 ? list[idx - 1] : null;
    const nextId = idx < list.length - 1 ? list[idx + 1] : null;

    area.innerHTML = `
      <div class="prev-next-row">
        ${prevId ? `<a href="place.html?id=${prevId}"><div class="label">← Previous</div><div class="name">View previous place</div></a>` : `<div></div>`}
        ${nextId ? `<a href="place.html?id=${nextId}" class="next-item"><div class="label">Next →</div><div class="name">View next place</div></a>` : `<div></div>`}
      </div>
    `;
  }

  function renderReviewForm() {
    const area = document.getElementById("review-form-area");
    if (!isLoggedIn()) {
      area.innerHTML = `<p style="color:#6B756E;"><a href="login.html" style="color:var(--green-deep);font-weight:600;">Log in</a> to leave a review.</p>`;
      return;
    }
    area.innerHTML = `
      <form class="review-form" id="review-form">
        <select id="r-rating">
          <option value="5">★★★★★ Excellent</option>
          <option value="4">★★★★ Good</option>
          <option value="3">★★★ Average</option>
          <option value="2">★★ Poor</option>
          <option value="1">★ Very poor</option>
        </select>
        <textarea id="r-comment" placeholder="Share your experience…" rows="3"></textarea>
        <button type="submit" class="btn">Submit review</button>
      </form>
    `;
    document.getElementById("review-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await apiSubmitReview(placeId, parseInt(document.getElementById("r-rating").value), document.getElementById("r-comment").value);
        loadPlace();
      } catch (err) {
        alert(err.message);
      }
    });
  }

  function renderReviews(reviews) {
    const listEl = document.getElementById("reviews-list");
    if (reviews.length === 0) {
      listEl.innerHTML = `<p style="color:#6B756E;">No reviews yet — be the first.</p>`;
      return;
    }
    listEl.innerHTML = reviews.slice().reverse().map(r => `
      <div class="review-card">
        <div class="review-head">
          <span><strong>${r.username}</strong></span>
          <span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
        </div>
        <p style="margin:0;">${r.comment || ""}</p>
      </div>
    `).join("");
  }

  loadPlace();
</script>
</body>
</html>
